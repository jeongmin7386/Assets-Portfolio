databases:
  - name: moa-postgres
    plan: basic-256mb
    databaseName: portfolio
    user: portfolio

services:
  - type: web
    name: moa-api
    runtime: docker
    plan: starter
    rootDir: asset-dashboard/backend
    dockerfilePath: ./asset-dashboard/backend/Dockerfile
    dockerContext: ./asset-dashboard/backend
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moa-postgres
          property: connectionString
      - key: DEMO_MODE
        value: "false"
      - key: FRONTEND_URL
        sync: false
      - key: NOTION_API_KEY
        sync: false
      - key: TOSS_CLIENT_ID
        sync: false
      - key: TOSS_CLIENT_SECRET
        sync: false
  - type: web
    name: moa-dashboard
    runtime: docker
    plan: starter
    rootDir: asset-dashboard/frontend
    dockerfilePath: ./asset-dashboard/frontend/Dockerfile
    dockerContext: ./asset-dashboard/frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
